<div class="dashboard-container">
  <header>
    <h1>Aether Metrics</h1>
    <p>Resumen Atmosférico</p>
  </header>

  <app-search-location></app-search-location>

  <app-error-banner
    *ngIf="weatherService.error$ | async as errorMessage"
    [message]="errorMessage"
    (retry)="weatherService.fetchWeatherData()"
  >
  </app-error-banner>

  <div *ngIf="weatherService.isLoading$ | async" class="loading-state">
    <p>⏳ Obteniendo datos meteorológicos...</p>
  </div>

  <ng-container *ngIf="!(weatherService.error$ | async) && !(weatherService.isLoading$ | async)">
    <div *ngIf="weatherService.state$ | async as data">
      <h2 class="city-title">{{ data.ciudad || 'San Francisco' }}</h2>

      <div class="metrics-grid">
        <app-metric-card
          title="Temperature"
          [value]="data.temperatura"
          unit="°C"
          icon="🌡️"
          linkRoute="/details/temperatura"
        >
        </app-metric-card>

        <app-metric-card
          title="Humidity"
          [value]="data.humedad"
          unit="%"
          icon="💧"
          linkRoute="/details/humedad"
        >
        </app-metric-card>

        <app-metric-card
          title="Wind Speed"
          [value]="data.viento"
          unit="km/h"
          icon="💨"
          linkRoute="/details/viento"
        >
        </app-metric-card>
      </div>
    </div>
  </ng-container>
</div>
